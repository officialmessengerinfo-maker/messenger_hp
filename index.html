<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudflare Pagesテスト用</title>

  <!-- ファビコンの指定 -->
  <link rel="icon" href="img/favicon.jpg" type="image/jpeg" />

  <!-- 外部CSSの読み込み -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Cloudflare Pagesテスト</h1>
    <p>これはCloudflare Pagesの紹介で使用するサンプルサイトです</p>
  </header>

  <main>
    <section class="section">
      <h2>このページについて</h2>
      <p>
        このサイトはHTML/CSS/JavaScriptだけで構成されており、Cloudflare Pagesで無料でホスティングされています。
      </p>
      <button class="cta-button" id="alertBtn">もっと知る</button>
    </section>

    <section class="section">
      <h2>使い方</h2>
      <ol>
        <li>このファイルをGitHubにpush</li>
        <li>Cloudflare Pagesに接続</li>
        <li>数秒でサイトが公開されます</li>
      </ol>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Cloudflare Pages Test</p>
  </footer>

  <!-- 外部JavaScriptの読み込み -->
  <script src="main.js"></script>

</html>
